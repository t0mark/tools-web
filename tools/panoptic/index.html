<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <title>Panoptic Segmentation · Tools Web</title>
  <link rel="icon" href="../../favicon.ico" sizes="32x32" />
  <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Tools Web" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <script src="../../assets/js/tap-guard.js?v=20261110e"></script>
  <link rel="stylesheet" href="../../assets/css/base.css?v=20261110d" />
  <link rel="stylesheet" href="style.css?v=20261110d" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-btn" href="../../" aria-label="도구 목록으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <h1>Panoptic Segmentation</h1>
    </div>
  </header>

  <main class="container">
    <input id="file-input" type="file" accept="image/*" class="sr-only" />

    <section id="pick-step">
      <div class="page-intro">
        <h2>사진 속 모든 영역 나누기</h2>
        <p>사진의 모든 픽셀을 사람·자동차 같은 물체(개체별)와 하늘·벽·바닥 같은 배경(종류별)으로 나눠 색으로 보여줘요. 133가지 종류를 구분해요.</p>
      </div>
      <label class="dropzone" for="file-input" id="dropzone">
        <div class="dropzone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 18 10 5 10-5" opacity=".5"/></svg>
        </div>
        <strong>이미지 선택</strong>
        <span>JPG · PNG · WebP 등</span>
      </label>
      <p class="hint">기기 안에서 처리되며 사진이 밖으로 전송되지 않아요.<br />처음 한 번 모델(약 48MB)을 내려받아요.</p>
    </section>

    <section id="work-step" class="hidden">
      <div class="stage">
        <canvas id="cv"></canvas>
        <div class="stage-loading hidden" id="loading">
          <span class="spinner"></span><span id="loading-text">분석 중…</span>
          <div class="progress hidden" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="toggle-row">
          <button type="button" class="chip" data-toggle="labels" aria-pressed="true">라벨</button>
          <button type="button" class="chip" data-toggle="borders" aria-pressed="true">경계선</button>
          <button type="button" class="chip" data-toggle="original" aria-pressed="false">원본만</button>
        </div>
        <div class="range-row">
          <label for="r-alpha">색 진하기</label>
          <input type="range" id="r-alpha" min="0" max="100" value="55" />
          <output id="r-alpha-out"></output>
        </div>
      </div>

      <div class="card">
        <h3>찾은 영역 <small id="seg-count"></small></h3>
        <ul class="legend" id="legend"></ul>
        <p class="small" id="legend-empty">아직 결과가 없어요.</p>
        <p class="small" id="timing"></p>
      </div>

      <div class="btn-row">
        <button type="button" class="btn" id="save-btn">이미지 저장</button>
        <label class="btn secondary" for="file-input">다른 이미지</label>
      </div>
    </section>

    <div class="card error-card hidden" id="error-box" role="alert">
      <strong>분석하지 못했어요</strong>
      <p id="error-text"></p>
    </div>

    <p class="footnote">모델: <a href="https://huggingface.co/onnx-community/maskformer-swin-tiny-coco" target="_blank" rel="noopener">MaskFormer Swin-Tiny</a> (COCO Panoptic 133종) ·
      실행: <a href="https://huggingface.co/docs/transformers.js" target="_blank" rel="noopener">transformers.js</a></p>
  </main>

  <script src="app.js?v=20261110d"></script>
</body>
</html>
