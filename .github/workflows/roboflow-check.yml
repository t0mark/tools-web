# 임시: SAM 3 서버리스 API가 퍼블리셔블 키를 받는지, 브라우저 호출(CORS)이 되는지 확인
name: roboflow-check
on:
  push:
    branches: [ccr-34ba176c-p38il1]
    paths: [.github/workflows/roboflow-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight (CORS)
        run: |
          curl -s -o /dev/null -D - -X OPTIONS \
            "https://serverless.roboflow.com/sam3/concept_segment?api_key=rf_N63pGkvI2EO7p23KkNZ4qlzLrfw2" \
            -H "Origin: https://t0mark.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | grep -i -E "^HTTP|access-control" || true
      - name: SAM 3 with publishable key
        run: |
          curl -s -D headers.txt -o body.json -w "HTTP %{http_code}\n" -X POST \
            "https://serverless.roboflow.com/sam3/concept_segment?api_key=rf_N63pGkvI2EO7p23KkNZ4qlzLrfw2" \
            -H "Origin: https://t0mark.github.io" \
            -H "Content-Type: application/json" \
            -d '{"format":"polygon","image":{"type":"url","value":"https://media.roboflow.com/notebooks/examples/dog.jpeg"},"prompts":[{"type":"text","text":"dog"},{"type":"text","text":"person"}],"output_prob_thresh":0.3}'
          grep -i "access-control" headers.txt || echo "(no CORS header on POST)"
          python3 - <<'PY'
          import json
          raw = open('body.json').read()
          try:
              d = json.loads(raw)
          except Exception:
              print('BODY:', raw[:500]); raise SystemExit
          if 'prompt_results' not in d:
              print('BODY:', raw[:500]); raise SystemExit
          for r in d['prompt_results']:
              preds = r['predictions']
              print(r['echo'].get('text'), '->', len(preds), 'masks', [round(p['confidence'], 2) for p in preds],
                    'points/poly:', [len(p['masks'][0]) for p in preds][:5])
          print('time', d.get('time'))
          PY
