# 임시: 브라우저용 파놉틱 모델 후보 비교
name: panoptic-probe
on:
  push:
    branches: [ccr-34ba176c-p38il1]
    paths: [.github/workflows/panoptic-probe.yml, .github/panoptic-test/*]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o cats.jpg http://images.cocodataset.org/val2017/000000039769.jpg
          curl -sSL -o room.jpg http://images.cocodataset.org/val2017/000000000139.jpg
          curl -sSL -o street.jpg http://images.cocodataset.org/val2017/000000000785.jpg
      - run: |
          mkdir -p p && cd p && npm init -y >/dev/null && npm i --no-audit --no-fund -s @huggingface/transformers@4.3.2
          cp ../.github/panoptic-test/probe.mjs .
          timeout 2700 node probe.mjs ../cats.jpg ../room.jpg ../street.jpg 2>&1 | grep -v "^\s*$" | tee ../.github/panoptic-test/probe.txt || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add .github/panoptic-test/probe.txt
          git commit -m "Panoptic model probe results" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
