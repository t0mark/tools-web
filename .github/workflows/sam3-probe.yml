# 임시: SAM 3 기기 실행 검증 (텍스트 특징 생성 → 파이썬 참조 실행 → 실제 페이지 E2E)
# 생성된 텍스트 특징 파일과 테스트 결과(로그 요약·스크린샷)만 이 브랜치에 커밋한다.
name: sam3-probe
on:
  push:
    branches: [ccr-34ba176c-p38il1]
    paths: [.github/workflows/sam3-probe.yml, .github/sam3-test/*.py, .github/sam3-test/*.mjs, tools/sam3-panoptic/*.js]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q onnxruntime numpy opencv-python-headless huggingface_hub transformers
      - name: Test images (COCO val2017)
        run: |
          curl -sSL -o cats.jpg http://images.cocodataset.org/val2017/000000039769.jpg
          curl -sSL -o room.jpg http://images.cocodataset.org/val2017/000000000139.jpg
      - name: Text embeddings + Python reference
        run: |
          python .github/sam3-test/gen.py cats.jpg room.jpg | tee .github/sam3-test/out/reference.txt
      - name: Browser E2E (CPU/WASM)
        run: |
          npm i --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium 2>&1 | tail -5
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node .github/sam3-test/e2e.mjs cats.jpg room.jpg 2>&1 | tee .github/sam3-test/out/e2e.txt
      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tools/sam3-panoptic/text-embeddings.json tools/sam3-panoptic/text-embeddings.bin .github/sam3-test/out
          git commit -m "SAM 3: generated text embeddings and test screenshots" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
