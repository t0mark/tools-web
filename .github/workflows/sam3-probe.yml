# 임시: SAM 3 기기 실행 검증 — 실제 페이지 E2E (헤드리스 Chromium, CPU/WASM)
name: sam3-probe
on:
  push:
    branches: [ccr-34ba176c-p38il1]
    paths: [.github/workflows/sam3-probe.yml, .github/sam3-test/*.mjs, tools/sam3-panoptic/*.js]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    steps:
      - uses: actions/checkout@v4
      - name: Test images (COCO val2017)
        run: |
          curl -sSL -o cats.jpg http://images.cocodataset.org/val2017/000000039769.jpg
          curl -sSL -o room.jpg http://images.cocodataset.org/val2017/000000000139.jpg
      - name: Browser E2E
        run: |
          npm i --no-audit --no-fund -s playwright@1.56.1
          npx playwright install --with-deps chromium 2>&1 | tail -1
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          rm -f .github/sam3-test/out/e2e-*
          timeout 1500 node .github/sam3-test/e2e.mjs 1 cats.jpg room.jpg 2>&1 | grep -v '"progress"' | tee .github/sam3-test/out/e2e-t1.txt || true
          timeout 600 node .github/sam3-test/e2e.mjs 4 cats.jpg 2>&1 | grep -v '"progress"' | tee .github/sam3-test/out/e2e-t4.txt || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A .github/sam3-test/out
          git commit -m "SAM 3: E2E results" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
