# 임시: SAM 3 기기 실행 검증 — onnxruntime-web 버전별 모델 호환성 확인
name: sam3-probe
on:
  push:
    branches: [ccr-34ba176c-p38il1]
    paths: [.github/workflows/sam3-probe.yml, .github/sam3-test/*.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q huggingface_hub
      - name: Download models
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for f in ['compact-448/sam3_image_encoder_fp16.onnx', 'compact-448/sam3_decoder.onnx']:
              p = hf_hub_download('rusen/sam3-browser-int8', f, revision='970196bb75edfbcdab59567ee017673a4c53adc7', local_dir='models')
              print(p)
          PY
      - name: onnxruntime-web versions
        run: |
          for v in 1.31.1 1.27.0 1.24.3 1.22.0 1.20.1; do
            mkdir -p ort-$v && (cd ort-$v && npm init -y >/dev/null && npm i --no-audit --no-fund -s onnxruntime-web@$v >/dev/null)
            timeout 600 node .github/sam3-test/ort-probe.mjs ort-$v models/compact-448/sam3_image_encoder_fp16.onnx models/compact-448/sam3_decoder.onnx 2>&1 | tee -a .github/sam3-test/out/ort-probe.txt || echo "TIMEOUT/CRASH $v" | tee -a .github/sam3-test/out/ort-probe.txt
          done
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add .github/sam3-test/out
          git commit -m "SAM 3: ort-web probe results" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
