<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <title>Tools Web</title>
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Tools Web" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/css/base.css?v=20261109c" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner"><h1>Tools Web</h1></div>
  </header>

  <main class="container">
    <section class="page-intro">
      <h2>무엇을 할까요?</h2>
      <p>사용할 도구를 선택하세요. 모든 처리는 기기 안에서 이루어지며 파일이 서버로 전송되지 않습니다.</p>
    </section>

    <!-- 새 도구를 추가할 때 아래 목록에 <li>를 추가하세요. -->
    <ul class="tool-list">
      <li>
        <a class="tool-card" href="tools/mp4-to-mp3/">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div class="tool-meta">
            <strong>MP4 → MP3</strong>
            <span>동영상에서 오디오만 추출해 MP3로 변환</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </li>
      <li>
        <a class="tool-card" href="tools/fft-image/">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l3-8 4 16 3-8h7"/></svg>
          </div>
          <div class="tool-meta">
            <strong>이미지 푸리에 변환</strong>
            <span>주파수 스펙트럼 보기 · 필터링 · 역변환</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </li>
      <li>
        <a class="tool-card" href="tools/3d-viewer/">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          </div>
          <div class="tool-meta">
            <strong>3D 모델 뷰어</strong>
            <span>GLB · OBJ · STL · FBX 등 미리보기</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </li>
      <li>
        <a class="tool-card" href="tools/panoptic/">
          <div class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 18 10 5 10-5"/></svg>
          </div>
          <div class="tool-meta">
            <strong>파놉틱 세그멘테이션</strong>
            <span>사진의 모든 픽셀을 물체·배경 종류별로 나누기</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
